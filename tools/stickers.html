<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Стикеры — Неделя на свои</title>
<!-- Лист всех стикеров продуктов и блюд: открыть tools/stickers.html, ?dark — на тёмном фоне -->
<link rel="stylesheet" href="../css/style.css">
<style>
  body { padding: 16px; }
  .sheet { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 14px 10px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font: 500 11px/1.2 var(--f-mono); color: var(--muted); }
  .cell .big { width: 72px; height: 72px; }
  .cell .big .stk { width: 100%; height: 100%; }
  h2 { margin: 24px 0 12px; }
</style>
</head>
<body>
<h1>Стикеры</h1>
<div id="out"></div>
<script src="../js/data/prices.js"></script>
<script src="../js/data/products.js"></script>
<script src="../js/data/recipes.js"></script>
<script src="../js/data/events.js"></script>
<script src="../js/stickers.js"></script>
<script>
  if (location.search.includes('dark')) document.documentElement.dataset.theme = 'dark';
  const S = NNS.stickers;
  const cell = (k) => `<div class="cell"><div class="big">${S.html(k)}</div>${S.nameOf(k)}</div>`;
  const missing = [...NNS.products, ...NNS.recipes, ...(NNS.outside || [])].filter((x) => !S.forName(x.name)).map((x) => x.name);
  document.getElementById('out').innerHTML =
    `<p class="small">Всего стикеров: ${S.keys.length}. Без стикера: ${missing.length ? missing.join(', ') : 'нет'}.</p>` +
    `<div class="sheet">${S.keys.map(cell).join('')}</div>`;
</script>
</body>
</html>
